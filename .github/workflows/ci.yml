name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Run Omarchy's own installer gate, fetched fresh from upstream so schema
      # drift in Omarchy fails this CI instead of silently accepting a manifest
      # the running shell would reject. Printed before running so the log shows
      # exactly what executed.
      - name: Validate with upstream omarchy-plugin-validate (quattro)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/basecamp/omarchy/quattro/bin/omarchy-plugin-validate" \
            -o /tmp/omarchy-plugin-validate
          cat /tmp/omarchy-plugin-validate
          bash /tmp/omarchy-plugin-validate .

      - name: Marketplace submission pre-checks
        run: scripts/check-submission.sh

      # Regression tripwires for the security-baseline classes that reached
      # us as a marketplace comment (shell quoting of QML-derived paths,
      # deadlines on compositor/network processes) plus the repo's own copy
      # rules (zh must be 書面語). See the script header for the exemptions.
      - name: Hardening + copy tripwires
        run: scripts/check-hardening.sh

      # Regression test for the fcitx5 toggle's classicui.conf merge contract
      # (issue #14): the window gets themed, the user's font and every
      # non-owned key survive apply/unapply. Throwaway HOMEs, stubbed
      # hyprctl/systemctl/omarchy-theme-color — no root, no compositor.
      - name: fcitx5 classicui.conf merge regression test
        run: scripts/test-fcitx5-conf.sh
