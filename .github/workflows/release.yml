name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag must match manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(jq -r .version manifest.json)
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "tag v$TAG does not match manifest version $VERSION" >&2
            exit 1
          fi

      # Local pre-checks only — this job holds the release-publishing token and
      # must not execute network-fetched code. The unpinned upstream validator
      # deliberately stays in CI (unprivileged) where schema drift belongs;
      # the tagged commit has already passed that CI on main.
      - name: Submission pre-checks
        run: scripts/check-submission.sh

      - name: Package plugin payload
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p dist/oma-swiss
          cp manifest.json BarWidget.qml ToolPanel.qml EvalQueue.qml tabler-icons.ttf \
             preview.png README.md README.zh-Hant.md AGENTS.md LICENSE dist/oma-swiss/
          cd dist && zip -r "oma-swiss-v${TAG}.zip" oma-swiss && cd ..
          sha256sum dist/*.zip > dist/sha256.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "OmaSwiss ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.zip dist/sha256.txt
