name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(jq -r .version manifest.json)
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "tag v$TAG does not match manifest version $VERSION" >&2
            exit 1
          fi

      - name: Validate before shipping
        run: |
          curl -fsSL "https://raw.githubusercontent.com/basecamp/omarchy/quattro/bin/omarchy-plugin-validate" \
            -o /tmp/omarchy-plugin-validate
          bash /tmp/omarchy-plugin-validate .
          scripts/check-submission.sh

      - name: Package plugin payload
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p dist/oma-swiss
          cp manifest.json BarWidget.qml ToolPanel.qml tabler-icons.ttf preview.png \
             README.md AGENTS.md LICENSE dist/oma-swiss/
          cd dist && zip -r "oma-swiss-v${TAG}.zip" oma-swiss && cd ..
          sha256sum dist/*.zip > dist/sha256.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "OmaSwiss ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.zip dist/sha256.txt
